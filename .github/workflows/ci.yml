name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      - name: Every module parses on this Node
        run: for f in bin/*.mjs lib/*.mjs test/*.mjs; do node --check "$f" || exit 1; done
      - name: Tests (offline; deprecations are errors)
        # The engine floor is 18.17, so a Node API that is deprecated anywhere in 18 to 22 fails here rather
        # than warning a user later.
        run: node --test test/*.test.mjs   # npm test, without npm itself running under these options
        env:
          NODE_OPTIONS: --throw-deprecation --pending-deprecation

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '22' }
      - name: Line, branch and function coverage of bin/ and lib/ (fails below 80% of lines or functions)
        run: npm run coverage

  mac-fix:
    name: mac fix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: The Mac fix is the published file
        # THIS PIN RUNS AHEAD OF THE SITE, under the posting freeze. www.deimoscore.com serves fix/fix-macos.sh as
        # a download and prints its SHA-256 on the page and in the site's public changelog, but it does not yet
        # serve or print the digest below: the newest site branch on the maintainer's machine serves 50e1e41d
        # (release 0.1.10, 27 Oct) and the highest Record entry for this file, CL-53, records d8a4bffd (the
        # round-4 script). Each earlier digest is in an earlier entry, back to CL-18, except one that CL-47 named
        # only until it was rewritten, which CL-52 records.
        #
        # Until 1 Nov 2026 this comment said the site prints THIS digest and that CL-53 records the values this
        # pin has held. Both became false the moment the pin moved to 464e3bbe (1d98436) and neither was noticed:
        # 464e3bbe appears on no site branch and in no Record entry, and CL-53 records d8a4bffd. A comment that
        # asserts the published state is itself a claim, and it was wrong in the file that is this project's own
        # mechanical guard for exactly this invariant.
        #
        # Any edit to the script, even a comment, breaks the published checksum. A deliberate change must update
        # the site's download, the page's hash, a new Record entry naming its predecessor and the changelog
        # together, and this hash and SECURITY.md's printed digest with them. The step below checks the three
        # copies that live in THIS repository; the site's are the owner's to ship and nothing here can see them.
        run: echo "0dae0dc901a23aba216211f4ef6002a6d75b232fe479ef79db463d5c1dc9b98c  fix/fix-macos.sh" | shasum -a 256 -c -
      - name: The digest chain agrees -- the file, the pin above and the digest SECURITY.md prints
        # The step above compares the script to ONE number in ONE file; every other copy of that number was
        # unguarded prose, and the chain drifted twice in forty-eight hours (2c9b4e2 fixed SECURITY.md on 31 Oct
        # after it printed the round-3 digest; by 1 Nov it was wrong again, with the file and this pin on
        # 464e3bbe and SECURITY.md telling the reader d8a4bffd, which belonged to neither, while four reviewers
        # were reading that tree). This compares all three, and the mode with them.
        run: bash test/digest-chain.sh
      - name: That check can fail -- its positive control and seven mutants
        # A check nobody has shown can fail is not a check. One control (three files that agree must pass) and
        # seven planted defects that must each be caught, including a shasum that prints nothing.
        run: bash test/digest-chain.selftest.sh
      - name: The Mac fix on copies of the vendored macOS 27.2 bundle, test/support/fixtures/macos-27.2-cert.pem (off macOS, that it refuses to run)
        run: bash test/fix-macos.check.sh
      - name: The Mac fix on the Mojave-era one-root shapes (offline, a stub for every probe)
        if: runner.os == 'macOS'
        run: bash test/support/mojave-shapes.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: ShellCheck, default checks
        run: |
          shellcheck --version
          shellcheck fix/fix-macos.sh test/fix-macos.check.sh

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: Every file declares its licence
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6.0.0

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Every commit is signed off
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The commits this push or pull request adds, and no others: the 13 commits before the sign-off rule
          # (21 October 2026) are never in a range. --no-merges, because on a pull request GitHub checks out a merge
          # commit it wrote itself, which nobody can sign off.
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER~1..$AFTER"
          fi
          fail=0; checked=0
          while read -r sha; do
            checked=$((checked + 1))
            author=$(git log -1 --format=%ae "$sha")
            case "$author" in *'[bot]@users.noreply.github.com') echo "skip $sha (bot: $author)"; continue ;; esac
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha is missing Signed-off-by (use git commit -s)"; fail=1
            fi
          done < <(git rev-list --no-merges "$range")
          # A range that matched nothing is a gate that checked nothing; say so rather than passing quietly.
          echo "checked $checked commit(s) in $range"
          exit $fail
