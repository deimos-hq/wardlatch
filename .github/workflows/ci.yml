name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      - name: Every module parses on this Node
        run: for f in bin/*.mjs lib/*.mjs test/*.mjs scripts/*.mjs scripts/corpus/*.mjs; do node --check "$f" || exit 1; done
      - name: Tests (offline; deprecations are errors)
        # The engine floor is 18.17, so a Node API that is deprecated anywhere in 18 to 22 fails here rather
        # than warning a user later.
        run: node --test test/*.test.mjs   # npm test, without npm itself running under these options
        env:
          NODE_OPTIONS: --throw-deprecation --pending-deprecation

  critical-mutants:
    # The bug that matters most for this tool: a result that should be UNKNOWN or EXPOSED printed as SAFE. Each 'UNKNOWN'
    # and 'EXPOSED' in the code is changed to 'SAFE' in a copy, one occurrence at a time, and the suite (with the static
    # SAFE-literal test skipped, so behaviour tests must do the catching) must fail on every copy, with a named test that
    # then fails on its own on that copy and passes on its own on the unmutated code, 3 times each, interleaved. The
    # unmutated copy must pass first, four times at the same load, every test the same each time. A test that gives
    # different results on the same code fails this job, named; so does a survivor, a timeout or any other end (a crash,
    # a signal), unless scripts/mutants-allowed.json lists the survivor with the reason no behaviour can tell it apart, or
    # scripts/mutants-gaps.json lists it as a known test gap (lists that may only shrink: a listed one that becomes
    # caught fails this job until it comes off its list; "gaps and allow lists only shrink" below fails on a new one).
    # The test that caught each planted bug is in the job summary and the critical-mutants artifact (results.json,
    # summary.md).
    # Not skipped for changes to documents alone: the release gate needs this check passed on the release commit itself,
    # and a skipped job would pass for code whose own run may have failed.
    name: critical mutants
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # One run per pull request: a new push cancels the run it replaces. On main every commit keeps its own run, so its
    # group is the commit itself: GitHub keeps one running and one pending run per group, and a newly queued run cancels
    # the pending one, so a shared group would leave a commit pushed between two others with a cancelled check, which
    # the release gate refuses.
    concurrency:
      group: critical-mutants-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '22' }
      - name: Every UNKNOWN or EXPOSED changed to SAFE is caught by a test
        run: node scripts/mutate.mjs --critical --jobs 4 --out "$RUNNER_TEMP/mutants"
      - name: The results, in the job summary
        if: always()
        run: test -f "$RUNNER_TEMP/mutants/summary.md" && cat "$RUNNER_TEMP/mutants/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: The results, as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: critical-mutants
          path: |
            ${{ runner.temp }}/mutants/results.json
            ${{ runner.temp }}/mutants/summary.md
          if-no-files-found: ignore
          retention-days: 30

  gaps-only-shrink:
    # scripts/mutants-gaps.json (known test gaps) and scripts/mutants-allowed.json (judged equivalent) may only shrink
    # (CLAUDE.md): an entry comes off when a test catches it, and only the maintainer adds one. An entry the same list at
    # the base doesn't have (the pull request's base, or main before this push; a list not there is compared with the last
    # release's, or with none) fails this job, naming it; the maintainer's own addition fails it on that one change, as
    # its record. The release gate checks both lists again against the last release, where each entry added since needs
    # the maintainer's approval written on it.
    name: gaps and allow lists only shrink
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '22' }
      - name: No entry in either list that the base doesn't have
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$AFTER~1"
          fi
          node scripts/gaps-only-shrink.mjs "$base"

  corpus:
    # Realistic machine layouts (servers, laptops, CI runners, and bad machines that must still be caught), run with this
    # commit and with the last release; every difference is listed in the job summary for review before a release. A
    # report, not a gate: some layouts' locked folders stand in for folders a service or another person owns, which only
    # root can set up, so run as this job's user they rightly read "could not be tested". It fails only when the run
    # itself fails. (scripts/corpus/run.mjs --gate, run as root with real owners, is the release criterion.)
    name: corpus (report against last release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '22' }
      - name: Build the corpus, and check out the last release beside this commit
        run: |
          base="$(git tag --list 'v*' --sort=-v:refname --no-contains HEAD | head -n 1)"
          test -n "$base" || { echo "::error::no earlier release tag to compare with"; exit 1; }
          echo "comparing with $base"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          node scripts/corpus/build.mjs "$RUNNER_TEMP/corpus"
      - name: Every layout, with this commit and with the last release
        shell: bash
        run: |
          set +e
          node scripts/corpus/run.mjs "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/base/bin/wardlatch.mjs" bin/wardlatch.mjs \
            --jobs 4 --out "$RUNNER_TEMP/corpus-results.json" > "$RUNNER_TEMP/corpus-report.md"
          s=$?
          cat "$RUNNER_TEMP/corpus-report.md"
          # 0: no differences; 1: differences, listed for review; anything else: the run failed
          [ "$s" -le 1 ] || { echo "::error::the corpus run failed (exit $s)"; exit "$s"; }
      - name: The report, in the job summary
        if: always()
        run: test -f "$RUNNER_TEMP/corpus-report.md" && cat "$RUNNER_TEMP/corpus-report.md" >> "$GITHUB_STEP_SUMMARY" || true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '22' }
      - name: Line, branch and function coverage of bin/ and lib/ (fails below 80% of lines or functions)
        run: npm run coverage

  mac-fix:
    name: mac fix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: The Mac fix is the published file
        # www.deimoscore.com serves fix/fix-macos.sh as a download and prints this SHA-256 on the page and in the
        # site's public changelog (CL-18). Any edit, even a comment, breaks that published checksum. A deliberate
        # change to the script must update the site's download, the page's hash and the changelog record together,
        # and this hash with them.
        run: echo "22153b4acaaa8675f9b4a87390a06cae077f9b5c8f748945ff6b886e400f6a86  fix/fix-macos.sh" | shasum -a 256 -c -
      - name: The Mac fix on copies of this runner's /etc/ssl/cert.pem (refuses to run off macOS)
        run: bash test/fix-macos.check.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: ShellCheck, default checks
        run: |
          shellcheck --version
          shellcheck fix/fix-macos.sh test/fix-macos.check.sh

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: Every file declares its licence
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6.0.0

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Every commit is signed off
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The commits this push or pull request adds, and no others: the 13 commits before the sign-off rule
          # (21 October 2026) are never in a range. --no-merges, because on a pull request GitHub checks out a merge
          # commit it wrote itself, which nobody can sign off.
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER~1..$AFTER"
          fi
          fail=0; checked=0
          while read -r sha; do
            checked=$((checked + 1))
            author=$(git log -1 --format=%ae "$sha")
            case "$author" in *'[bot]@users.noreply.github.com') echo "skip $sha (bot: $author)"; continue ;; esac
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha is missing Signed-off-by (use git commit -s)"; fail=1
            fi
          done < <(git rev-list --no-merges "$range")
          # A range that matched nothing is a gate that checked nothing; say so rather than passing quietly.
          echo "checked $checked commit(s) in $range"
          exit $fail
