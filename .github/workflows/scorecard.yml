#
# OpenSSF Scorecard: an automated supply-chain score, published so the README badge resolves. It reads what the
# repository does rather than what it says: review on every change, pinned actions, SAST, a dependency updater, a
# security policy, signed releases. The score moves on repository settings and release practice more than on any
# one commit, so it runs on push to main and weekly.
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 1'
  push:
    branches: [main]
permissions: read-all

jobs:
  analysis:
    name: analyse
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF so findings show in the Security tab
      id-token: write          # publish the result so the badge resolves
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }

      # v2.4.4 pulls its container from ghcr.io. Older tags pull from a gcr.io project whose billing is disabled
      # and fail before reading a file.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: results.sarif
