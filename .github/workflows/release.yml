#
# Cut a GitHub release when a v* tag is pushed, and attest what was built. It never publishes to npm: the maintainer
# publishes the exact npm package attested here (docs/RELEASING.md), so the file on npm can be checked against this
# run.
#
# Keyless, through Sigstore: the attestation binds each file to the GitHub OIDC identity of this workflow run and
# commit. There is no signing key to store, leak, lose or hand to a successor. It answers "which workflow, at which
# commit, built this file", not "was that commit any good"; the tests and review answer that.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The tests and the release gate run first, in a job whose token can only read: they run the repository's own code
  # (and the gate gets GH_TOKEN), so they never hold the token that writes the release or the OIDC token that signs.
  gate:
    name: release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read         # the checkout, and the releases the release gate compares the survivor lists with
      checks: read           # the release gate reads every check GitHub ran on the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }   # every tag and origin/main, which the gate reads
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '22' }

      # Nothing ships untested.
      - name: Tests
        run: node --test test/*.test.mjs   # npm test, without npm itself running under these options
        env:
          NODE_OPTIONS: --throw-deprecation --pending-deprecation

      # docs/RELEASING.md, "Before you cut a release": both reviews on file for the code being released, nothing that runs
      # changed after them, every past advisory's kind of mistake looked for again, the corpus gate's GATE PASSED quoted,
      # the tagged commit on main, every check GitHub ran on it passed (this run's own jobs aside), the critical-mutant
      # gate and the corpus report among them, and the survivor lists only shrunk since the last release. A tag for a
      # version older than 0.1.10 is refused: 0.1.0 to 0.1.9 were released before the gate, and no older one ever was. A
      # tag pushed before CI finished on its commit fails here: re-run this workflow once it has.
      - name: The release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-check.mjs --ci

  release:
    needs: gate
    runs-on: ubuntu-latest
    environment: release     # waits for a maintainer's approval (Settings → Environments → release; v* tags only)
    permissions:
      contents: write        # create the release
      id-token: write        # what lets Sigstore issue a keyless certificate
      attestations: write    # record the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '22' }

      # A release labelled v0.2.0 that contains 0.1.0 is a lie that is very hard to notice later.
      - name: Tag matches package.json, and the changelog has an entry for it
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"; exit 1; fi
          grep -q "^## \[$pkg\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$pkg]' section"; exit 1; }
          echo "VERSION=$pkg" >> "$GITHUB_ENV"

      - name: Build the source archive and the npm package
        run: |
          git archive --format=tar.gz --prefix="wardlatch-$GITHUB_REF_NAME/" -o "wardlatch-$GITHUB_REF_NAME.tar.gz" "$GITHUB_REF_NAME"
          npm pack --silent
          test -f "wardlatch-$VERSION.tgz"
          sha256sum "wardlatch-$GITHUB_REF_NAME.tar.gz" "wardlatch-$VERSION.tgz" | tee SHA256SUMS
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md

      - name: Attest what was built
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            wardlatch-${{ github.ref_name }}.tar.gz
            wardlatch-${{ env.VERSION }}.tgz

      # Nothing goes out unless the bundle is there and verifies: an attest action that changed its outputs (v4 moved
      # them once) would otherwise publish a release without its bundle, or with an empty file.
      - name: Check the attestation before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          test -n "$BUNDLE" && test -s "$BUNDLE" || { echo "no attestation bundle from the attest step"; exit 1; }
          node -e 'const l=require("fs").readFileSync(process.argv[1],"utf8").trim().split("\n"); if(l.length!==1) throw new Error("expected one bundle, got "+l.length); JSON.parse(l[0])' "$BUNDLE"
          for f in "wardlatch-$GITHUB_REF_NAME.tar.gz" "wardlatch-$VERSION.tgz"; do
            gh attestation verify "$f" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      # The attestation is also in GitHub's attestation store; the bundle beside the files serves verifiers without
      # GitHub, and OpenSSF Scorecard, which looks for it there.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "wardlatch-$VERSION.tgz.sigstore.json"
          cat >> notes.md <<NOTES

          ## Verifying this release

          The npm package and the source archive carry a Sigstore attestation bound to the workflow run and commit
          that built them. There is no key to import.

          \`\`\`
          npm pack wardlatch@$VERSION
          gh attestation verify wardlatch-$VERSION.tgz --repo $GITHUB_REPOSITORY \\
            --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/$GITHUB_REF_NAME \\
            --deny-self-hosted-runners
          \`\`\`

          See docs/RELEASING.md for the offline check with the attached bundle, and for the signed tag.
          NOTES
          gh release create "$GITHUB_REF_NAME" --title "wardlatch $VERSION" --notes-file notes.md \
            "wardlatch-$GITHUB_REF_NAME.tar.gz" "wardlatch-$VERSION.tgz" SHA256SUMS "wardlatch-$VERSION.tgz.sigstore.json"
