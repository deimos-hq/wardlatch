#
# Wardlatch has no npm dependencies, so the only things to keep current are the GitHub Actions its workflows pin by
# commit SHA. Dependabot proposes the updates as one pull request a week, grouped so that actions released together
# (CodeQL's init, analyze and upload-sarif) move together, and the pull request goes through CI and review like any
# change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ["*"]
