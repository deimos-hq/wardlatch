version = 1
SPDX-PackageName = "wardlatch"
SPDX-PackageSupplier = "Deimos AI LLC (https://www.deimoscore.com)"
SPDX-PackageDownloadLocation = "https://github.com/deimos-hq/wardlatch"

# Bulk licensing declarations, for files that cannot carry a comment header or
# where one would be noise.
#
# Source files carry their own header: every file under bin/, lib/, test/ and
# .github/workflows/, except fix/fix-macos.sh (below). This covers the rest:
# prose and config, where a two-line legal preamble above the first heading is
# clutter, and JSON, which has no comment syntax to put one in. The incident
# files in lib/incidents/ are Deimos AI LLC's own write-ups of public
# advisories, under the same licence as the code.

[[annotations]]
path = ["**.md", "NOTICE", ".gitignore"]
SPDX-FileCopyrightText = "2026 Deimos AI LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**.json", "**.yml", "**.yaml", "**.toml"]
SPDX-FileCopyrightText = "2026 Deimos AI LLC"
SPDX-License-Identifier = "Apache-2.0"

# The README banner (dark and light plates): Deimos AI LLC's own drawing. The
# WARDLATCH letters are drawn, not typed; the small lines are DM Mono (SIL Open
# Font License, which leaves images made with the font free of it). Apache-2.0
# grants no rights to the Wardlatch or Deimos names (its section 6). Not in the
# npm package.
[[annotations]]
path = ".github/assets/**"
SPDX-FileCopyrightText = "2026 Deimos AI LLC"
SPDX-License-Identifier = "Apache-2.0"

# The Mac fix is the one source file without an in-file header, on purpose.
# www.deimoscore.com serves this exact file as a download and publishes its
# SHA-256 (50e1e41d...21b1) on the page and in its changelog, so a header
# comment would break the published checksum. CI fails if the file's hash
# changes; a deliberate change updates the site's download, the printed hash
# and its changelog record together.
[[annotations]]
path = "fix/fix-macos.sh"
SPDX-FileCopyrightText = "2026 Deimos AI LLC"
SPDX-License-Identifier = "Apache-2.0"

# The one file that is not Deimos AI LLC's work: two public root certificates,
# redistributed unchanged so the positive control can force them in (see
# NOTICE). Apache-2.0 does not apply to them, and nothing here relicenses them.
[[annotations]]
path = "lib/incidents/emudhra-2026-10-roots.pem"
SPDX-FileCopyrightText = ["Comodo CA Limited (AAA Certificate Services)", "eMudhra Technologies Limited (emSign ECC Root CA - G3)"]
SPDX-License-Identifier = "LicenseRef-Public-CA-Certificate"

# the same two certificates, one per file: each root's control forces only its own root
[[annotations]]
path = "lib/incidents/emudhra-2026-10-root-aaa.pem"
SPDX-FileCopyrightText = "Comodo CA Limited (AAA Certificate Services)"
SPDX-License-Identifier = "LicenseRef-Public-CA-Certificate"

[[annotations]]
path = "lib/incidents/emudhra-2026-10-root-emsign.pem"
SPDX-FileCopyrightText = "eMudhra Technologies Limited (emSign ECC Root CA - G3)"
SPDX-License-Identifier = "LicenseRef-Public-CA-Certificate"

# The published npm packages, kept so `shasum -a 256 -c SHA256SUMS` can be checked in a clone.
[[annotations]]
path = ["wardlatch-*.tgz", "SHA256SUMS"]
SPDX-FileCopyrightText = "2026 Deimos AI LLC"
SPDX-License-Identifier = "Apache-2.0"

# Test fixtures: public certificates and their fingerprints, unchanged, as NOTICE says of the roots above.
[[annotations]]
path = ["test/support/fixtures/macos-27.2-cert.pem", "test/support/fixtures/macos-27.2-handfixed-cert.pem", "test/support/fixtures/macos-27.2.1-cert.pem", "test/support/fixtures/emudhra-2026-10-compromised-keys.pem", "test/support/fixtures/emudhra-2026-10-apple-ht149555.tsv", "test/support/fixtures/emudhra-2026-11-g2-cas.pem", "test/support/fixtures/emudhra-2026-11-bug2083449-c82.tsv"]
SPDX-FileCopyrightText = "The certificate authorities named in each certificate"
SPDX-License-Identifier = "LicenseRef-Public-CA-Certificate"

# Deimos AI LLC's own self-signed certificate, generated for the negative control (a cert that must be refused).
[[annotations]]
path = "lib/negative-control.pem"
SPDX-FileCopyrightText = "2026 Deimos AI LLC"
SPDX-License-Identifier = "Apache-2.0"

# A minimal macOS version property list (factual version strings), authored by Deimos as a test fixture.
[[annotations]]
path = "test/support/fixtures/SystemVersion-27.2.1.plist"
SPDX-FileCopyrightText = "2026 Deimos AI LLC"
SPDX-License-Identifier = "Apache-2.0"
